# Extra JARs (Delta, Kafka, S3A, PostgreSQL) are baked into $SPARK_HOME/jars by the Dockerfile, so no spark.jars needed
spark.sql.extensions                                io.delta.sql.DeltaSparkSessionExtension
spark.sql.catalog.spark_catalog                     org.apache.spark.sql.delta.catalog.DeltaCatalog
# Hive metastore (Hive 4.0.1): talk to it with the matching client baked into the image, not Spark's built-in 2.3.10
spark.sql.catalogImplementation                     hive
spark.hadoop.hive.metastore.uris                    thrift://hive-metastore:9083
spark.sql.hive.metastore.version                    4.0.1
spark.sql.hive.metastore.jars                       path
spark.sql.hive.metastore.jars.path                  file:///opt/hive-metastore-client/*.jar
# s3 configuraion
spark.hadoop.fs.s3.endpoint                        http://minio:9000
spark.hadoop.fs.s3.access.key                      minio
spark.hadoop.fs.s3.secret.key                      minio123
spark.hadoop.fs.s3.path.style.access               true
spark.hadoop.fs.s3.connection.ssl.enabled          false
spark.hadoop.fs.s3.impl                            org.apache.hadoop.fs.s3a.S3AFileSystem
# s3a configuration
spark.hadoop.fs.s3a.endpoint                        http://minio:9000
spark.hadoop.fs.s3a.access.key                      minio
spark.hadoop.fs.s3a.secret.key                      minio123
spark.hadoop.fs.s3a.path.style.access               true
spark.hadoop.fs.s3a.connection.ssl.enabled          false
spark.hadoop.fs.s3a.impl                            org.apache.hadoop.fs.s3a.S3AFileSystem
